name: Windows checks and build
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked -- --test-threads=1
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked --bins
      - name: Verify executable replacement and restart
        run: ./tests/update-e2e.ps1
      - name: Verify public update without login
        run: ./target/release/avt-cli.exe verify-update
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-msvc
          path: |
            target/release/AVT-Replenishment.exe
            target/release/avt-cli.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: caption-preview
          path: target/caption-preview.png
